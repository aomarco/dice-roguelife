<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#000000" id="themeColor" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dice Roguelife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!-- build:styles -->
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          Dice Roguelife<small id="brandSub"><span data-t>A life the dice decide</span>, v<!-- build:version --></small>
        </div>
        <button
          class="btn ghost"
          id="gearBtn"
          type="button"
          aria-label="Settings"
          data-t-attr="aria-label"
          style="padding: 6px 9px; order: 2"
        >
          ⚙
        </button>
        <nav class="tabs" aria-label="Screens" data-t-attr="aria-label">
          <button data-tab="play" aria-current="true" data-t>Play</button>
          <button data-tab="saves" data-t>Saves</button>
          <button data-tab="memory" data-t>Memory</button>
          <button data-tab="images" data-t>Images</button>
          <button data-tab="hall" data-t>Hall</button>
        </nav>
      </header>
      <main>
        <section class="view on" id="v-play">
          <div id="noSample" class="notice hidden"></div>
          <div
            id="strip"
            class="strip hidden"
            role="button"
            tabindex="0"
            aria-label="Open the status window"
            data-t-attr="aria-label"
          ></div>
          <div id="log" class="log"></div>
          <div id="composer" class="composer hidden">
            <div id="slash" class="slash hidden" role="listbox"></div>
            <div id="inputHint" class="ihint hidden">
              <span data-t-html
                >Tip: write speech and actions as they are, and put only thoughts or scene notes inside
                <i>*asterisks*</i>. No one in the scene hears what is inside asterisks.</span
              ><button type="button" aria-label="Close the tip" data-t-attr="aria-label">×</button>
            </div>
            <form id="form">
              <textarea
                id="input"
                rows="1"
                placeholder="*scene*, *thoughts*, speech, actions, /commands"
                aria-label="Your input"
                data-t-attr="aria-label"
              ></textarea>
              <div class="sendcol">
                <button class="btn primary" id="sendBtn" type="submit" data-t>Send</button
                ><label class="entertog" title="Send with the Enter key" data-t-attr="title"
                  ><input type="checkbox" id="enterTog" /> <span data-t>Enter sends</span></label
                >
              </div>
            </form>
          </div>
        </section>
        <section class="view" id="v-saves"><div class="pad" id="savesBox"></div></section>
        <section class="view" id="v-memory"><div class="pad" id="memBox"></div></section>
        <section class="view" id="v-images"><div class="pad" id="imgBox"></div></section>
        <section class="view" id="v-hall"><div class="pad" id="hallBox"></div></section>
      </main>
    </div>
    <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="inner" id="sheetInner"></div></div>

    <!-- build:scripts -->
  </body>
</html>
